# Checks the Astro site in website/ and publishes it to GitHub Pages.
#
# Pull request: type-check (astro check) and a full build, so a frontmatter
# typo, a broken import or a type error fails on the PR instead of on main.
# Push to main: the same checks, then the build is deployed to Pages.
#
# This is the only workflow that publishes the site. The previous root-level
# static.yml (which uploaded the whole repo verbatim) was removed when the v1
# site was archived — see the v1-legacy tag.
name: Website (check + deploy)

on:
  # Every pull request runs the checks, whatever it touches: `build` is a
  # required check on main, so a PR that skipped it could never be merged.
  pull_request:

  push:
    branches: ["main"]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"

  workflow_dispatch:

permissions:
  contents: read

# A PR run is superseded by the next push to the same PR. Deploys queue in one
# group and are never cancelled midway, so Pages is not left half-published.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: website

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
