# Checks the Astro site in website/ and publishes it to GitHub Pages.
#
# Pull request: type-check (astro check) and a full build, so a frontmatter
# typo, a broken import or a type error fails on the PR instead of on main.
# Push to main: the same checks, then the build is deployed to Pages.
#
# The CV PDF is rendered here from files/cv/ with the CV_PHONE secret and is
# never committed, so the phone number exists only in the published site
# (docs/adr/0005-cv-rendered-in-ci-with-the-phone-from-a-secret.md).
#
# This is the only workflow that publishes the site. The previous root-level
# static.yml (which uploaded the whole repo verbatim) was removed when the v1
# site was archived — see the v1-legacy tag.
name: Website (check + deploy)

on:
  # Every pull request runs the checks, whatever it touches: `build` is a
  # required check on main, so a PR that skipped it could never be merged.
  pull_request:

  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "files/cv/**"
      - ".github/workflows/deploy-website.yml"

  workflow_dispatch:

permissions:
  contents: read

# A PR run is superseded by the next push to the same PR. Deploys queue in one
# group and are never cancelled midway, so Pages is not left half-published.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: website

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      # WeasyPrint at the version the CV was laid out with. The Fira fonts come
      # from files/cv/fonts/; DejaVu Sans draws the ▸ markers, as on the laptop.
      - name: Install the CV renderer
        working-directory: .
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core poppler-utils
          python3 -m venv "$RUNNER_TEMP/cv"
          "$RUNNER_TEMP/cv/bin/pip" install -q weasyprint==69.0
          echo "$RUNNER_TEMP/cv/bin" >> "$GITHUB_PATH"

      - name: Render the CV
        working-directory: .
        env:
          # Pull requests from forks and Dependabot get no secrets, so they
          # render with a placeholder; a push to main fails without the secret.
          CV_PHONE: ${{ secrets.CV_PHONE || (github.event_name == 'pull_request' && '+000 00 000 0000' || '') }}
        run: bash files/cv/render.sh

      - name: Check the CV fonts
        working-directory: .
        run: |
          fonts=$(pdffonts website/public/files/stefan-seman-cv.pdf | tail -n +3 | awk '{print $1}' | sed 's/^[A-Z]*+//')
          echo "$fonts"
          test -n "$fonts"
          if grep -vqE '^(Fira-(Sans|Mono)|DejaVu-Sans)' <<<"$fonts"; then
            echo "::error::the CV fell back to a font other than Fira (DejaVu Sans only for the ▸ markers)"
            exit 1
          fi

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
